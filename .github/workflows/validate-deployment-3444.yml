name: Validate deployment workflow #3444

on:
  push:
    branches:
      - fix/deploy-workflow-validation-3444
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deployment validation regression tests
        run: bunx vitest run apps/sim/lib/workflows/deployment-validation.test.ts
